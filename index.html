<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suka Ba Jalan Ni Minggu?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 28px 22px;
      border-radius: 18px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .gif {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 14px;
      margin: 0 auto 14px auto;
      display: block;
    }
    h1 {
      font-size: 22px;
      color: #c9184a;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 14px;
      color: #555555;
      margin: 0 0 22px 0;
    }
    .btns {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }
    .btn {
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 15px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.15s ease;
    }
    #yes {
      background: #25d366;
      color: #ffffff;
    }
    #no {
      background: #e0e0e0;
      color: #333333;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="gif" src="https://tenor.com" alt="Kucing Lucu" onerror="this.style.display='none'" />
    <h1>Suka Ba Jalan Ni Minggu?</h1>
    <p>Jang Ba Paksa, cuma boleh lo</p>
    <div class="btns">
      <a id="yes" class="btn" href="#">Yes</a>
      <button id="no" class="btn" type="button">No</button>
    </div>
  </div>

  <script>
    // Merakit alamat WhatsApp secara utuh tanpa terpotong
    const domain = "https://" + "://whatsapp.com" + "/send";
    const nomor = "628891261808";
    const teks = encodeURIComponent("Begitu kwa , so nemboleh mo rubah pikiran !!");
    const urlTujuan = domain + "?phone=" + nomor + "&text=" + teks;

    // Memasang link utuh ke tombol Yes
    const yesBtn = document.getElementById("yes");
    yesBtn.setAttribute("href", urlTujuan);

    // Logika tombol No kabur
    const noBtn = document.getElementById("no");
    let skalaYes = 1;

    function kabur() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 24);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 24);
      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      skalaYes += 0.1;
      yesBtn.style.transform = "scale(" + skalaYes + ")";
    }

    noBtn.addEventListener("mouseover", kabur);
    noBtn.addEventListener("touchstart", function (e) {
      e.preventDefault();
      kabur();
    });
  </script>
</body>
</html>
