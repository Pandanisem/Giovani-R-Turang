<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suka Ba Jalan Ni Minggu?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 28px 22px;
      border-radius: 18px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .cat-emoji {
      font-size: 64px;
      margin-bottom: 10px;
      display: block;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
    h1 {
      font-size: 22px;
      color: #c9184a;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 14px;
      color: #555555;
      margin: 0 0 22px 0;
    }
    .btns {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }
    button {
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    #yes {
      background: #25d366;
      color: #ffffff;
    }
    #no {
      background: #e0e0e0;
      color: #333333;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="cat-emoji">🥺🐱</span>
    <h1>Suka Ba Jalan Ni Minggu?</h1>
    <p>Jang Ba Paksa, cuma boleh lo</p>
    <div class="btns">
      <button id="yes" type="button" onclick="bukaWA()">Yes</button>
      <button id="no" type="button">No</button>
    </div>
  </div>

  <script>
    function bukaWA() {
      const no = "628891261808";
      const pesan = encodeURIComponent("Begitu kwa , so nemboleh mo rubah pikiran !!");
      
      // 1. Panggil langsung aplikasi WhatsApp di HP
      window.top.location.href = "whatsapp://send?phone=" + no + "&text=" + pesan;
      
      // 2. Cadangan jika dibuka lewat Laptop/PC
      setTimeout(function() {
        window.top.location.href = "https://" + "://whatsapp.com" + "/send?phone=" + no + "&text=" + pesan;
      }, 800);
    }

    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    let skalaYes = 1;

    function kabur() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 24);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 24);
      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      skalaYes += 0.1;
      yesBtn.style.transform = "scale(" + skalaYes + ")";
    }

    noBtn.addEventListener("mouseover", kabur);
    noBtn.addEventListener("touchstart", function (e) {
      e.preventDefault();
      kabur();
    });
  </script>
</body>
</html>
