<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suka Ba Jalan Ni Minggu? ✨</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(-45deg, #ffdee9, #ffc8dd, #ffafcc, #f8edeb);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Dekorasi Hati & Bintang Melayang di Background */
    .bg-deco {
      position: fixed;
      font-size: 24px;
      opacity: 0.45;
      pointer-events: none;
      animation: floatUp 6s infinite ease-in-out alternate;
      z-index: 0;
    }
    @keyframes floatUp {
      from { transform: translateY(0px) rotate(-10deg); }
      to { transform: translateY(-25px) rotate(10deg); }
    }

    #pindah-halaman { display: none; }

    /* Kartu Glassmorphism Estetik */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      padding: 36px 28px;
      border-radius: 34px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(255, 77, 109, 0.18), inset 0 0 20px rgba(255, 255, 255, 0.6);
      text-align: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #halaman-2 { display: none; text-align: left; }
    #pindah-halaman:checked ~ #halaman-1 { display: none; }
    #pindah-halaman:checked ~ #halaman-2 {
      display: block;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(15px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Avatar Kucing Lucu */
    .cat-wrapper {
      width: 104px; height: 104px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #fff0f3, #ffd6e0);
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(255, 117, 143, 0.25);
    }
    .cat-emoji {
      font-size: 54px;
      display: block;
      animation: bounce 1.1s infinite alternate ease-in-out;
    }
    @keyframes bounce {
      from { transform: translateY(3px) scale(0.96) rotate(-4deg); }
      to { transform: translateY(-8px) scale(1.04) rotate(4deg); }
    }

    h1 {
      font-size: 25px;
      font-weight: 800;
      color: #c9184a;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    /* Badge Peringatan Lucu (Muncul saat No disentuh) */
    #teks-paksa {
      display: none;
      background: #fff0f3;
      color: #d90429;
      border: 1.5px dashed #ff8fa3;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      margin: 8px auto 18px;
      width: fit-content;
      animation: wiggle 0.4s ease;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg); }
      75% { transform: rotate(4deg); }
    }

    .btns {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 58px;
      margin-top: 18px;
    }

    .btn-yes {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 16px;
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(255, 77, 109, 0.4);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
      user-select: none;
    }
    .btn-yes:hover {
      box-shadow: 0 14px 28px rgba(255, 77, 109, 0.55);
    }

    #no {
      padding: 14px 28px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      border: 2px solid #ffe5ec;
      background: #ffffff;
      color: #8d99ae;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
      transition: left 0.2s ease, top 0.2s ease;
    }

    /* HALAMAN 2 */
    #halaman-2 h2 {
      font-size: 23px;
      font-weight: 800;
      color: #c9184a;
      margin-bottom: 4px;
      text-align: center;
    }
    #halaman-2 .sub {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #805b68;
    }

    .opsi-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 20px;
    }

    .opsi-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 16px;
      border-radius: 20px;
      border: 2px solid #ffe5ec;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .opsi-item:hover {
      transform: translateY(-2px);
      border-color: #ffb3c1;
    }
    .opsi-item:has(input:checked) {
      background: #fff0f3;
      border-color: #ff4d6d;
      box-shadow: 0 8px 18px rgba(255, 77, 109, 0.15);
      transform: scale(1.02);
    }

    .opsi-kiri { display: flex; align-items: center; gap: 12px; }
    .opsi-icon {
      font-size: 22px;
      background: linear-gradient(135deg, #fff0f3, #ffe5ec);
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 14px;
    }
    .opsi-teks { font-size: 15px; font-weight: 700; color: #3d2c33; }
    .opsi-item input[type="radio"] { width: 20px; height: 20px; accent-color: #ff4d6d; cursor: pointer; }

    .jam-group {
      background: rgba(255, 255, 255, 0.9);
      padding: 14px 16px;
      border-radius: 20px;
      border: 2px solid #ffe5ec;
      margin-bottom: 20px;
    }
    .jam-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #c9184a;
      margin-bottom: 8px;
    }
    .jam-group input[type="time"] {
      width: 100%;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      border: 2px solid #ffccd5;
      border-radius: 14px;
      background: #fff8f9;
      color: #3d2c33;
      outline: none;
    }
    .jam-group input[type="time"]:focus {
      border-color: #ff4d6d;
    }

    #btn-kirim {
      width: 100%;
      border: none;
      font-family: inherit;
      font-weight: 800;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff;
      padding: 16px;
      font-size: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 22px rgba(37, 211, 102, 0.35);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #btn-kirim:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(37, 211, 102, 0.45);
    }

    .toast-error {
      display: none;
      background: #ffe3e3;
      color: #c92a2a;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 14px;
      text-align: center;
      border: 1.5px solid #ffa8a8;
      animation: wiggle 0.4s ease;
    }

    /* Animasi Hujan Hati saat klik Yes */
    .heart-confetti {
      position: fixed;
      top: -30px;
      font-size: 24px;
      pointer-events: none;
      z-index: 9999;
      animation: fallDown 2.5s linear forwards;
    }
    @keyframes fallDown {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Hiasan Melayang di Background -->
  <div class="bg-deco" style="top: 10%; left: 10%;">🌸</div>
  <div class="bg-deco" style="top: 18%; right: 14%; animation-delay: 1s;">✨</div>
  <div class="bg-deco" style="bottom: 15%; left: 12%; animation-delay: 2s;">💖</div>
  <div class="bg-deco" style="bottom: 12%; right: 10%; animation-delay: 1.5s;">🦋</div>

  <input type="checkbox" id="pindah-halaman">

  <!-- HALAMAN 1 -->
  <div class="card" id="halaman-1">
    <div class="cat-wrapper"><span class="cat-emoji" id="cat-icon">🥺🐱</span></div>
    <h1>Suka Ba Jalan Ni Minggu?</h1>
    <p id="teks-paksa">Jang ba paksa, cuma boleh jawab io ✨</p>
    <div class="btns">
      <label for="pindah-halaman" class="btn-yes" id="yes" onclick="hujanHati()">Yes, Gas! 💖</label>
      <button id="no" type="button">No</button>
    </div>
  </div>

  <!-- HALAMAN 2 -->
  <div class="card" id="halaman-2">
    <h2>Yey! Mo Kamana Torang? 🥰</h2>
    <p class="sub">Pilih jo tempat deng depe jam le ✨</p>

    <div class="opsi-list">
      <label class="opsi-item">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏖️</span>
          <span class="opsi-teks">Pergi ke pantai</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke pantai">
      </label>

      <label class="opsi-item">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏞️</span>
          <span class="opsi-teks">Pergi ke Danau Moat</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke Danau Moat">
      </label>

      <label class="opsi-item">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏙️</span>
          <span class="opsi-teks">Pergi ke Manado</span>
        </div>
