<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suka Ba Jalan Ni Minggu?</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }
    #pindah-halaman { display: none; }
    .card {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(201, 24, 74, 0.15);
      text-align: center;
    }
    #halaman-2 { display: none; text-align: left; }
    #pindah-halaman:checked ~ #halaman-1 { display: none; }
    #pindah-halaman:checked ~ #halaman-2 { display: block; }

    .cat-wrapper {
      width: 96px; height: 96px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #fff0f3, #ffccd5);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .cat-emoji { font-size: 52px; display: block; animation: bounce 1.2s infinite alternate ease-in-out; }
    @keyframes bounce {
      from { transform: translateY(2px) rotate(-3deg); }
      to { transform: translateY(-8px) rotate(3deg); }
    }
    h1 { font-size: 24px; font-weight: 800; color: #a4133c; margin-bottom: 12px; }
    
    /* Teks disembunyikan dulu sebelum tombol No disentuh */
    #teks-paksa {
      display: none;
      font-size: 14px;
      color: #6c5860;
      margin-bottom: 24px;
    }

    .btns { display: flex; justify-content: center; align-items: center; gap: 16px; min-height: 52px; margin-top: 16px; }
    .btn-yes {
      display: inline-block; padding: 14px 32px; border-radius: 999px;
      font-weight: 700; font-size: 15px;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35); cursor: pointer;
    }
    #no {
      padding: 14px 32px; border-radius: 999px; font-family: inherit;
      font-weight: 700; font-size: 15px; border: none;
      background: #f1f3f5; color: #495057; cursor: pointer; z-index: 999;
    }

    #halaman-2 h2 { font-size: 22px; font-weight: 800; color: #a4133c; margin-bottom: 6px; text-align: center; }
    #halaman-2 .sub { text-align: center; margin-bottom: 22px; font-size: 13.5px; color: #6c5860; }
    .opsi-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
    .opsi-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #ffffff; padding: 14px 16px; border-radius: 16px;
      border: 2px solid #ffe5ec; cursor: pointer;
    }
    .opsi-item:has(input:checked) { background: #fff0f3; border-color: #ff4d6d; }
    .opsi-kiri { display: flex; align-items: center; gap: 12px; }
    .opsi-icon {
      font-size: 22px; background: #fff5f7; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; border-radius: 12px;
    }
    .opsi-teks { font-size: 15px; font-weight: 600; color: #2b2d42; }
    .opsi-item input[type="radio"] { width: 20px; height: 20px; accent-color: #ff4d6d; }

    .jam-group {
      background: #ffffff; padding: 16px; border-radius: 16px;
      border: 2px solid #ffe5ec; margin-bottom: 22px;
    }
    .jam-group label { display: block; font-size: 13.5px; font-weight: 700; color: #a4133c; margin-bottom: 8px; }
    .jam-group input[type="time"] {
      width: 100%; padding: 12px 14px; font-family: inherit; font-size: 16px;
      font-weight: 700; border: 1.5px solid #ffccd5; border-radius: 12px;
      background: #fff8f9; color: #2b2d42;
    }

    #btn-kirim {
      width: 100%; border: none; font-family: inherit;
      font-weight: 700; background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff; padding: 16px; font-size: 16px; border-radius: 16px;
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); cursor: pointer;
    }
    .toast-error {
      display: none; background: #ffe3e3; color: #c92a2a;
      font-size: 13px; font-weight: 600; padding: 10px 14px;
      border-radius: 10px; margin-bottom: 14px; text-align: center;
      border: 1px solid #ffa8a8;
    }
  </style>
</head>
<body>

  <input type="checkbox" id="pindah-halaman">

  <!-- HALAMAN 1 -->
  <div class="card" id="halaman-1">
    <div class="cat-wrapper"><span class="cat-emoji">🥺🐱</span></div>
    <h1>Suka Ba Jalan Ni Minggu?</h1>
    <p id="teks-paksa">Jang ba paksa, cuma boleh jawab io ✨</p>
    <div class="btns">
      <label for="pindah-halaman" class="btn-yes" id="yes">Yes, Gas!</label>
      <button id="no" type="button">No</button>
    </div>
  </div>

  <!-- HALAMAN 2 -->
  <div class="card" id="halaman-2">
    <h2>Yey! Mo Kamana Torang? 🥰</h2>
    <p class="sub">Pilih Jo Deng Depe Jam Le</p>

    <div class="opsi-list">
      <label class="opsi-item">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏖️</span>
          <span class="opsi-teks">Pergi ke pantai</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke pantai">
      </label>

      <label class="opsi-item">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏞️</span>
          <span class="opsi-teks">Pergi ke Danau Moat</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke Danau Moat">
      </label>

      <label class="opsi-item">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏙️</span>
          <span class="opsi-teks">Pergi ke Manado</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke Manado">
      </label>

      <label class="opsi-item">
        <div class="opsi-kiri">
          <span class="opsi-icon">☕</span>
          <span class="opsi-teks">Di Kotamobagu saja</span>
        </div>
        <input type="radio" name="tujuan" value="Di Kotamobagu saja">
      </label>
    </div>

    <div class="jam-group">
      <label for="pilih-jam">⏰ Jam berapa siap?</label>
      <input type="time" id="pilih-jam" value="16:00">
    </div>

    <div class="toast-error" id="pesan-error">Pilih dulu salah satu ya 😊</div>

    <button id="btn-kirim" type="button" onclick="bukaWA()">Kirim ke WhatsApp 🚀</button>
  </div>

  <script>
    function bukaWA() {
      const pilihan = document.querySelector('input[name="tujuan"]:checked');
      const jam = document.getElementById("pilih-jam").value || "16:00";
      const errBox = document.getElementById("pesan-error");

      if (!pilihan) {
        errBox.style.display = "block";
        return;
      }

      errBox.style.display = "none";

      const no = "628891261808";
      const teks = "Okeeeeyyy gas! Minggu ini torang jalan:\n\n" +
                   "Pilihan Tempat: " + pilihan.value + "\n" +
                   "Jam: " + jam + " WITA";
      const pesan = encodeURIComponent(teks);

      // 1. Panggil langsung aplikasi WhatsApp di HP
      window.top.location.href = "whatsapp://send?phone=" + no + "&text=" + pesan;

      // 2. Cadangan jika dibuka lewat Laptop/PC
      setTimeout(function() {
        window.top.location.href = "https://whatsapp.com" + no + "&text=" + pesan;
      }, 800);
    }

    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const teksPaksa = document.getElementById("teks-paksa");
    let skalaYes = 1;

    function kabur() {
      // Munculkan teks saat tombol No pertama kali disentuh/ditekan
      teksPaksa.style.display = "block";

      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 24);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 24);
      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      skalaYes += 0.1;
      yesBtn.style.transform = "scale(" + skalaYes + ")";
    }

    noBtn.addEventListener("mouseover", kabur);
    noBtn.addEventListener("touchstart", function (e) {
      e.preventDefault();
      kabur();
    });
  </script>
</body>
</html>
