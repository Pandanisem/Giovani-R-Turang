<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suka Ba Jalan Ni Minggu?</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }
    #pindah-halaman { display: none; }
    .card {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(201, 24, 74, 0.15);
      text-align: center;
    }
    #halaman-2 { display: none; text-align: left; }
    #pindah-halaman:checked ~ #halaman-1 { display: none; }
    #pindah-halaman:checked ~ #halaman-2 { display: block; }

    .cat-wrapper {
      width: 96px; height: 96px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #fff0f3, #ffccd5);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .cat-emoji { font-size: 52px; display: block; animation: bounce 1.2s infinite alternate ease-in-out; }
    @keyframes bounce {
      from { transform: translateY(2px) rotate(-3deg); }
      to { transform: translateY(-8px) rotate(3deg); }
    }
    h1 { font-size: 24px; font-weight: 800; color: #a4133c; margin-bottom: 8px; }
    p { font-size: 14px; color: #6c5860; margin-bottom: 28px; }

    .btns { display: flex; justify-content: center; align-items: center; gap: 16px; min-height: 52px; }
    .btn-yes {
      display: inline-block; padding: 14px 32px; border-radius: 999px;
      font-weight: 700; font-size: 15px;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35); cursor: pointer;
    }
    #btn-no {
      padding: 14px 32px; border-radius: 999px; font-family: inherit;
      font-weight: 700; font-size: 15px; border: none;
      background: #f1f3f5; color: #495057; cursor: pointer; z-index: 999;
    }

    #halaman-2 h2 { font-size: 22px; font-weight: 800; color: #a4133c; margin-bottom: 6px; text-align: center; }
    #halaman-2 .sub { text-align: center; margin-bottom: 22px; font-size: 13.5px; }
    .opsi-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
    .opsi-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #ffffff; padding: 14px 16px; border-radius: 16px;
      border: 2px solid #ffe5ec; cursor: pointer;
    }
    .opsi-item:has(input:checked) { background: #fff0f3; border-color: #ff4d6d; }
    .opsi-kiri { display: flex; align-items: center; gap: 12px; }
    .opsi-icon {
      font-size: 22px; background: #fff5f7; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; border-radius: 12px;
    }
    .opsi-teks { font-size: 15px; font-weight: 600; color: #2b2d42; }
    .opsi-item input[type="radio"] { width: 20px; height: 20px; accent-color: #ff4d6d; }

    .jam-group {
      background: #ffffff; padding: 16px; border-radius: 16px;
      border: 2px solid #ffe5ec; margin-bottom: 22px;
    }
    .jam-group label { display: block; font-size: 13.5px; font-weight: 700; color: #a4133c; margin-bottom: 8px; }
    .jam-group input[type="time"] {
      width: 100%; padding: 12px 14px; font-family: inherit; font-size: 16px;
      font-weight: 700; border: 1.5px solid #ffccd5; border-radius: 12px;
      background: #fff8f9; color: #2b2d42;
    }

    #link-wa {
      display: block; width: 100%; text-align: center; text-decoration: none;
      font-weight: 700; background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff; padding: 16px; font-size: 16px; border-radius: 16px;
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
    }
    .catatan-buka {
      margin-top: 12px; font-size: 12px; color: #888; text-align: center;
    }
  </style>
</head>
<body>

  <input type="checkbox" id="pindah-halaman">

  <!-- HALAMAN 1 -->
  <div class="card" id="halaman-1">
    <div class="cat-wrapper"><span class="cat-emoji">🥺🐱</span></div>
    <h1>Suka Ba Jalan Ni Minggu?</h1>
    <p>Jang ba paksa, cuma boleh jo lo ✨</p>
    <div class="btns">
      <label for="pindah-halaman" class="btn-yes" id="btn-yes">Yes, Gas!</label>
      <button id="btn-no" type="button" onclick="lari()" ontouchstart="lari()" onmouseover="lari()">No</button>
    </div>
  </div>

  <!-- HALAMAN 2 -->
  <div class="card" id="halaman-2">
    <h2>Yey! Mau Kemana Kita? 🥰</h2>
    <p class="sub">Pilih 1 tempat tujuan & atur jamnya ya</p>

    <div class="opsi-list">
      <label class="opsi-item" onclick="setTujuan('Pergi ke pantai')">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏖️</span>
          <span class="opsi-teks">Pergi ke pantai</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke pantai" checked>
      </label>

      <label class="opsi-item" onclick="setTujuan('Pergi ke Danau Moat')">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏞️</span>
          <span class="opsi-teks">Pergi ke Danau Moat</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke Danau Moat">
      </label>

      <label class="opsi-item" onclick="setTujuan('Pergi ke Manado')">
        <div class="opsi-kiri">
          <span class="opsi-icon">🏙️</span>
          <span class="opsi-teks">Pergi ke Manado</span>
        </div>
        <input type="radio" name="tujuan" value="Pergi ke Manado">
      </label>

      <label class="opsi-item" onclick="setTujuan('Di Kotamobagu saja')">
        <div class="opsi-kiri">
          <span class="opsi-icon">☕</span>
          <span class="opsi-teks">Di Kotamobagu saja</span>
        </div>
        <input type="radio" name="tujuan" value="Di Kotamobagu saja">
      </label>
    </div>

    <div class="jam-group">
      <label for="pilih-jam">⏰ Jam berapa siap?</label>
      <input type="time" id="pilih-jam" value="16:00" onchange="updateWA()" oninput="updateWA()">
    </div>

    <!-- Link murni HTTPS tanpa JS blocker -->
    <a id="link-wa" href="https://wa.me" target="_top">
      Kirim ke WhatsApp 🚀
    </a>
    <p class="catatan-buka">Jika tidak terbuka, ketuk titik tiga di pojok kanan atas lalu pilih <b>Buka di Chrome / Browser</b></p>
  </div>

  <script>
    var skala = 1;
    var tempatTerpilih = "Pergi ke pantai";

    function lari() {
      var btnNo = document.getElementById("btn-no");
      var btnYes = document.getElementById("btn-yes");
      var maxX = Math.max(20, window.innerWidth - 120);
      var maxY = Math.max(20, window.innerHeight - 60);
      btnNo.style.position = "fixed";
      btnNo.style.left = Math.floor(Math.random() * maxX) + "px";
      btnNo.style.top = Math.floor(Math.random() * maxY) + "px";
      skala += 0.12;
      btnYes.style.transform = "scale(" + skala + ")";
    }

    function setTujuan(namaTempat) {
      tempatTerpilih = namaTempat;
      updateWA();
    }

    function updateWA() {
      var jam = document.getElementById("pilih-jam").value || "16:00";
      var pesan = "Okeeeeyyy gas! Minggu ini kita jalan:\n\n" +
                  "Pilihan Tempat: " + tempatTerpilih + "\n" +
                  "Jam: " + jam + " WITA";
      document.getElementById("link-wa").href = "https://wa.me" + encodeURIComponent(pesan);
    }
  </script>
</body>
</html>
